user root;
worker_processes  1;
pid runtime/nginx/nginx.pid;
error_log runtime/nginx/error.log warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log runtime/nginx/access.log;
    sendfile on;

    server {
        listen 3026;
        server_name _;
        root /root/code/group26/MarkLens/web;
        index index.html;
        client_max_body_size 8m;

        location /api/ {
            proxy_pass http://127.0.0.1:8026;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8026/health;
            proxy_set_header Host $host;
        }

        location / { try_files $uri $uri/ /index.html; }
    }
}
