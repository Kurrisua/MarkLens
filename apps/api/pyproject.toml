[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marklens-api"
version = "0.2.0"
description = "MarkLens multimodal trademark retrieval and trustworthy legal RAG API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "pymysql>=1.1,<2.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "argon2-cffi>=23.1,<26.0",
  "numpy>=2.1,<3.0",
  "pillow>=11.1,<12.0",
  "reportlab>=4.2,<5.0",
  "pypdf>=5.0,<6.0",
  "httpx>=0.28,<1.0",
  "imagehash>=4.3,<5.0",
  "rapidfuzz>=3.11,<4.0",
  "pypinyin>=0.53,<1.0",
  "rank-bm25>=0.2.2,<1.0",
  "langchain>=0.3,<2.0",
  "langchain-core>=0.3,<2.0",
  "langchain-text-splitters>=0.3,<2.0",
  "langchain-deepseek>=0.1,<2.0",
  "fastembed>=0.5,<1.0",
  "rapidocr>=3.4,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
